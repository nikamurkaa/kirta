name: Refactor private dependency

on:
  push:
    branches: [portfolio-ci]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-ci

      - name: Replace legacy logger import and private module
        run: |
          python - <<'PY'
          from pathlib import Path

          handler = Path('kirta-backend-api/internal/api/handler.go')
          text = handler.read_text()
          text = text.replace('\t"github.com/mast-se/go-lib/logger"\n', '\t"log/slog"\n')
          text = text.replace('log  logger.Logger', 'log  *slog.Logger')
          text = text.replace('func NewScanHandler(log logger.Logger, scan ScanSvc)', 'func NewScanHandler(log *slog.Logger, scan ScanSvc)')
          handler.write_text(text)

          go_mod = Path('kirta-backend-api/go.mod')
          mod = go_mod.read_text()
          mod = mod.replace('\tgithub.com/mast-se/go-lib v0.0.0-20260508132108-8850016dcee4\n', '')
          go_mod.write_text(mod)
          PY

      - name: Format Go files
        run: |
          cd kirta-backend-api
          gofmt -w internal/app/app.go internal/config/config.go internal/api/server.go internal/api/logging_middleware.go internal/api/handler.go

      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kirta-backend-api/internal/api/handler.go kirta-backend-api/internal/api/logging_middleware.go kirta-backend-api/internal/api/server.go kirta-backend-api/internal/app/app.go kirta-backend-api/internal/config/config.go kirta-backend-api/go.mod
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: remove private Go infrastructure dependency"
          git push origin HEAD:portfolio-ci
