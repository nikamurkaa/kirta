name: Repair frontend lockfile

on:
  push:
    branches: [portfolio-ci]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kirta-ui

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-ci

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kirta-ui/package-lock.json

      - name: Apply non-breaking dependency fixes
        run: npm audit fix --package-lock-only || true

      - name: Install from repaired lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit lockfile
        working-directory: .
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kirta-ui/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: update frontend dependency lockfile"
          git push origin HEAD:portfolio-ci
